
apiVersion: apps/v1
kind: Deployment

metadata:
  name: three-tier-app-deployment
  labels:
    app: three-tier-app

spec:
  replicas: 2

  selector:
    matchLabels:
      app: three-tier-app

  template:
    metadata:
      labels:
        app: three-tier-app

    spec:
      containers:
        - name: three-tier-app
          image: sarthakiparad2230/three-tier-app:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          envFrom:
            - secretRef:
                name: three-tier-app-db-secrets

          env:
            - name: PORT
              value: "3000"
            - name: NODE_ENV
              value: "production"

          # Check whether application is ready for traffic
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          # Check whether application is alive
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

